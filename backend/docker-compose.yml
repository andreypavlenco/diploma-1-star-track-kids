
services:
  backend:
    build:
      context: ./backend
    container_name: startrack-backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    command: sh -c "npx prisma generate && npm run build && npm run start:prod"

  postgres:
    image: postgres:15
    container_name: startrack-postgres
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ./env/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: startrack-redis
    restart: always
    ports:
      - "6379:6379"
    env_file:
      - ./env/redis.env

volumes:
  pgdata:
